    <style>
      /* 隐藏所有广告容器 */
      #imaContainer,
      #imaContainer_new,
      #sdk__advertisement,
      #gmLoadingText,
      iframe[src*="imasdk"],
      iframe[src*="doubleclick"],
      iframe[src*="googlesyndication"],
      iframe[title="Advertisement"],
      div[id*="google_ads"],
      div[id*="aswift"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 定期清除动态插入的广告元素
      setInterval(function() {
        var adSelectors = [
          '#imaContainer',
          '#imaContainer_new', 
          '#sdk__advertisement',
          '#gmLoadingText',
          'iframe[src*="imasdk"]',
          'iframe[src*="doubleclick"]',
          'iframe[src*="googlesyndication"]',
          'iframe[title="Advertisement"]',
          'div[id*="google_ads"]',
          'div[id*="aswift"]'
        ];
        
        adSelectors.forEach(function(selector) {
          var elements = document.querySelectorAll(selector);
          elements.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        });

        // 阻止广告SDK函数
        if (window.sdk_init) window.sdk_init = function() {};
        if (window.sdk) window.sdk = { showBanner: function() {}, requestAd: function() {} };
        if (window.adBreak) window.adBreak = function() {};
        if (window.adConfig) window.adConfig = function() {};
      }, 500);
    </script>

  </head>

<body>
	<script type="text/javascript">
		window.SDK_OPTIONS = {
			gameId: "bg0jl3b02is3pi0c7dbgqm1yfbc68qj8",
			onEvent: function (a) {
				switch (a.name) {
					case "SDK_GAME_PAUSE":
						gamesfineFn.gameOnBlur();
						is_ads = true;
						// pause game logic / mute audio
						break;
					case "SDK_GAME_START":
						gamesfineFn.gameOnFocus();
						is_ads = false;
						break;
					case "SDK_READY":
						// when sdk is ready
						break;
				}
			}
		};
		(function (a, b, c) {
			var d = a.getElementsByTagName(b)[0];
			a.getElementById(c) || (a = a.createElement(b), a.id = c, a.src = "https://api.gamemonetize.com/sdk.js", d.parentNode.insertBefore(a, d))
		})(document, "script", "gamemonetize-sdk");
	</script>

	<script type="text/javascript">
		var is_ads = false;
		if (!is_ads) {
			window.onfocus = function () {
				gamesfineFn.gameOnFocus();
			}
			window.onblur = function () {
				gamesfineFn.gameOnBlur();
			}
		}

		var GamesFine = {
			config: { url: 'http://www.gamesfine.com/?utm_source=gm&utm_medium=mothers_day_float_connect' },
			showAds: function () {
				if (typeof sdk !== 'undefined' && sdk.showBanner !== 'undefined') {
					sdk.showBanner();
				}
			},
			showMoreBtn: true,
			timeStamp: '2023/05/21'
		}

	</script>

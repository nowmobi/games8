<!-- Define the document type and language -->
<!DOCTYPE html>
<html lang="en">
<head>
  
  <!--  Meta  -->
  <!-- Set the character encoding for the document -->
  <meta charset="UTF-8" />
  <!-- Set the title of the web page -->
  <title>Link 4</title>
  
  <!--  Set the viewport for responsive design -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!--  Styles  -->
  <!-- Include a font from Google Fonts API -->
  <link href="https://fonts.googleapis.com/css?family=Doppio+One" rel="stylesheet">
  <!-- Include a CSS file for styling the web page -->
  <link rel="stylesheet" href="styles/index.processed.css">

    <style>
      /* 隐藏所有广告容器 */
      #imaContainer,
      #imaContainer_new,
      #sdk__advertisement,
      #gmLoadingText,
      iframe[src*="imasdk"],
      iframe[src*="doubleclick"],
      iframe[src*="googlesyndication"],
      iframe[title="Advertisement"],
      div[id*="google_ads"],
      div[id*="aswift"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 定期清除动态插入的广告元素
      setInterval(function() {
        var adSelectors = [
          '#imaContainer',
          '#imaContainer_new', 
          '#sdk__advertisement',
          '#gmLoadingText',
          'iframe[src*="imasdk"]',
          'iframe[src*="doubleclick"]',
          'iframe[src*="googlesyndication"]',
          'iframe[title="Advertisement"]',
          'div[id*="google_ads"]',
          'div[id*="aswift"]'
        ];
        
        adSelectors.forEach(function(selector) {
          var elements = document.querySelectorAll(selector);
          elements.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        });

        // 阻止广告SDK函数
        if (window.sdk_init) window.sdk_init = function() {};
        if (window.sdk) window.sdk = { showBanner: function() {}, requestAd: function() {} };
        if (window.adBreak) window.adBreak = function() {};
        if (window.adConfig) window.adConfig = function() {};
      }, 500);
    </script>

  </head>
<body>
  <!-- Main content wrapper -->
  <div class="wrapper" style="scale: 0.7;">
    <!-- Result panel to show game outcomes (win/loss/tie) - hidden by default -->
    <div class="result" style="display:none;">
      <!-- Panel to display win result - hidden by default -->
      <div class="result-panel win" style="display:none;">
        <h1>CONGRATULATIONS! <br> YOU WIN!!</h1>
      </div>
      <!-- Panel to display loss result - hidden by default -->
      <div class="result-panel loss" style="display:none;">
        <h1>Better Luck <Br> Next Time!</h1>
      </div>
      <!-- Panel to display tie result - hidden by default -->
      <div class="result-panel tie" style="display:none;">
        <h1>That's a <Br> Tie!</h1>
      </div>
    </div>
    <!-- Panel to display game information - hidden by default -->
    <div class="info-panel" align="center" style="display:none;">  
      <div class="panel info">
        <!-- Heading for game information -->
        <h2></h2>
        <!-- Placeholder for additional game information -->
        <div class="blurb"></div>
        <!-- Placeholder for outlook information -->
        <div class="outlook"></div>
      </div>
    </div>
    <!-- Content container -->
    <div class="content">
      <!-- Sidebar containing game settings and controls -->
      <div class="sidebar">
        <!-- Game title -->
        <h1>Link 4</h1>
        <!-- Panel for selecting game difficulty -->
        <div class="panel dif">
          <!-- Heading for difficulty selection -->
          <h2>Difficulty</h2>
          <!-- Difficulty options presented as radio buttons -->
          <div class="dif-options">
            <div>
              <input id="dif1" type="radio" name="dif-options" value="1">
              <label for="dif1">1</label>
            </div>
            <div>
              <input id="dif2" type="radio" name="dif-options" value="2">
              <label for="dif2">2</label>
            </div>
            <div>
              <input id="dif3" type="radio" name="dif-options" value="3" checked>
              <label for="dif3">3</label>
            </div>
            <div>
              <input id="dif4" type="radio" name="dif-options" value="4">
              <label for="dif4">4</label>
            </div>
            <div>
              <input id="dif5" type="radio" name="dif-options" value="5">
              <label for="dif5">5</label>
            </div>
          </div>
        </div>
        <!-- Panel for selecting game theme -->
        <div class="panel bor">
          <!-- Heading for theme selection -->
          <h2>Theme</h2>
          <!-- Theme options presented as radio buttons with background images -->
          <div class="bor-options">
            <div>
              <input id="bor1" type="radio" name="bor-options" value="1" checked>
              <!-- Use background image for this theme option -->
              <label for="bor1" style="background: url(images/boards/board1.png);background-size: contain;"></label>
            </div>
            <div>
              <input id="bor2" type="radio" name="bor-options" value="2">
              <label for="bor2" style="background: url(images/boards/board2.png);background-size: contain;"></label>
            </div>
          </div>
        </div>
        <!-- Panel for selecting sound options -->
        <div class="panel mus">
          <!-- Heading for sound selection -->
          <h2>Sound</h2>
          <!-- Sound options presented as radio buttons with background images -->
          <div class="mus-options">
            <div>
              <input id="mus1" type="radio" name="mus-options" value="1" checked>
              <!-- Use background image for this sound option -->
              <label for="mus1" style="background: url(images/sound-on.png);background-size: contain;"></label>
            </div>
            <div>
              <input id="mus2" type="radio" name="mus-options" value="0">
              <label for="mus2" style="background: url(images/sound-off.png);background-size: contain;"></label>
            </div>
          </div>
        </div>
        <!-- Button to start the game -->
        <div class="start">
          <button>Start Game</button>
        </div>
      </div>
      <!-- Game board container - hidden by default -->
      <div class="board" style="display: none;">
        <!-- Container for lit columns (game columns) -->
        <div class="lit-columns">
          <!-- Individual column placeholders -->
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
        <!-- Container for lit cells (game cells) -->
        <div class="lit-cells"></div>
        <!-- Container for game chips (tokens) -->
        <div class="chips"></div>
        <!-- Container for clickable columns (to drop chips) -->
        <div class="click-columns">
          <!-- Individual clickable column placeholders -->
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <!-- Include the jQuery library from Google CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
  <!-- Include a custom JavaScript file for handling game logic -->
  <script src="scripts/index.js"></script>
</body>
</html>

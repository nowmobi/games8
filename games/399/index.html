    <style>
      /* 隐藏所有广告容器 */
      #imaContainer,
      #imaContainer_new,
      #sdk__advertisement,
      #gmLoadingText,
      iframe[src*="imasdk"],
      iframe[src*="doubleclick"],
      iframe[src*="googlesyndication"],
      iframe[title="Advertisement"],
      div[id*="google_ads"],
      div[id*="aswift"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 定期清除动态插入的广告元素
      setInterval(function() {
        var adSelectors = [
          '#imaContainer',
          '#imaContainer_new', 
          '#sdk__advertisement',
          '#gmLoadingText',
          'iframe[src*="imasdk"]',
          'iframe[src*="doubleclick"]',
          'iframe[src*="googlesyndication"]',
          'iframe[title="Advertisement"]',
          'div[id*="google_ads"]',
          'div[id*="aswift"]'
        ];
        
        adSelectors.forEach(function(selector) {
          var elements = document.querySelectorAll(selector);
          elements.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        });

        // 阻止广告SDK函数
        if (window.sdk_init) window.sdk_init = function() {};
        if (window.sdk) window.sdk = { showBanner: function() {}, requestAd: function() {} };
        if (window.adBreak) window.adBreak = function() {};
        if (window.adConfig) window.adConfig = function() {};
      }, 500);
    </script>

    <body ondragstart="return false;" ondrop="return false;" >
        <div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
        <script>
            $(document).ready(function(){
                window.SDK_OPTIONS = {
                    gameId: "wm43az3123kq2ecatqjuv3mmoddq1j6m", // Fill the game_id
                    onEvent: function (a) {
                        switch (a.name) {
                            case "SDK_GAME_PAUSE":
                                // pause game logic / mute audio
                                //console.log('SDK game paused');
                                oMain.PauseGame();
                                break;
                            case "SDK_GAME_START":
                                //console.log('SDK game start');
                                oMain.StartGame();
                                break;
                            case "SDK_READY":
                                   break;
                            case "SDK_ERROR":
                                // when sdk get error
                                break;
                        }
                    }
                }; 

                var oMain = new CMain({    
                    malus_hint:10000,   //TIME TO REMOVE IF USER USES AN HINT
                    audio_enable_on_startup:false,//ENABLE/DISABLE AUDIO WHEN GAME STARTS 
                    fullscreen:true     //SET THIS TO FALSE IF YOU DON'T WANT TO SHOW FULLSCREEN BUTTON
                });

                $(oMain).on("start_session", function(evt) {
                    if(getParamValue('ctl-arcade') === "true"){
                        parent.__ctlArcadeStartSession();
                    }
                    //...ADD YOUR CODE HERE EVENTUALLY
                });

                $(oMain).on("end_session", function(evt) {
                    if(getParamValue('ctl-arcade') === "true"){
                        parent.__ctlArcadeEndSession();
                    }
                    //...ADD YOUR CODE HERE EVENTUALLY
                });

                $(oMain).on("restart_level", function(evt, iLevel) {
                    if(getParamValue('ctl-arcade') === "true"){
                        parent.__ctlArcadeRestartLevel({level:iLevel});
                    }
                });

                $(oMain).on("start_level", function(evt, iLevel) {
                    if(getParamValue('ctl-arcade') === "true"){
                        parent.__ctlArcadeStartLevel({level:iLevel});
                    }
                });

                $(oMain).on("end_level", function(evt,iLevel) {
                    if(getParamValue('ctl-arcade') === "true"){
                        parent.__ctlArcadeEndLevel({level:iLevel});
                    }
                });

                $(oMain).on("save_score", function(evt,iScore) {
                    if(getParamValue('ctl-arcade') === "true"){
                        parent.__ctlArcadeSaveScore({score:iScore});
                    }
                    //...ADD YOUR CODE HERE EVENTUALLY
                });

                $(oMain).on("show_interlevel_ad", function(evt) {
                    if(getParamValue('ctl-arcade') === "true"){
                        parent.__ctlArcadeShowInterlevelAD();
                    }
                    //...ADD YOUR CODE HERE EVENTUALLY
                });


                if(isIOS()){
                    setTimeout(function(){sizeHandler();},200); 
                }else{ 
                    sizeHandler(); 
                }
            });

        </script>
